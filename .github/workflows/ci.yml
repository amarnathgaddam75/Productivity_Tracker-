name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Unit tests (shared core)
        run: npm test
      - name: Build desktop renderer
        run: npm run build:desktop
      - name: Build landing page + mobile PWA (hosting bundle)
        run: npm run build:hosting
